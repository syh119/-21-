# 地图文件路径，同文件夹直接写文件名，建议用绝对路径避免报错
image: /root/ros2_ws/src/nav_pkg/maps/mmp.png
# 分辨率：1像素=0.05米，和你Nav2代价地图的配置必须100%一致
resolution: 0.05
# 地图原点：地图左下角对应世界坐标(0,0,0)，和发车点P对齐，路径点计算更方便
origin: [0.5, 0.5, 0.0]
# 固定参数，无需修改
negate: 0
# 黑色区域（灰度<0.65）判定为致命禁区，绝对不可通行
occupied_thresh: 0.65
# 白色区域（灰度>0.25）判定为可通行空间
free_thresh: 0.25