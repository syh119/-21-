amcl:
  ros__parameters:
    use_sim_time: false
    alpha1: 0.05
    alpha2: 0.05
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_footprint"
    global_frame_id: "map"
    odom_frame_id: "odom"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.5
    laser_max_range: 5.0
    laser_min_range: 0.1
    laser_model_type: "likelihood_field"
    max_beams: 50
    max_particles: 3000
    min_particles: 2000
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 10
    recovery_alpha_fast: 0.08
    recovery_alpha_slow: 0.008
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    tf_broadcast: true
    transform_tolerance: 0.15
    update_min_a: 0.01
    update_min_d: 0.01
    z_hit: 0.9
    z_max: 0.01
    z_rand: 0.1
    z_short: 0.01
    scan_topic: "/scan_deskewed"

